name: CI

# Builds everything from a clean checkout and runs the non-interactive tests: the language files, the Core + CLI + the
# context-menu DLL with all unit tests (Release), and the WinUI app (Release, framework-dependent and self-contained).
# The UI smoke tests need an interactive desktop and are not run here. Packaging (installer, zips, MSIX) is not part of
# this repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages for the tests
        run: python -m pip install pillow

      - name: 7-Zip headers and binaries (fixed SHA-256)
        shell: powershell
        run: |
          .\scripts\fetch-7zip.ps1
          .\scripts\fetch-7zip.ps1 -Binaries

      - name: Environment check
        shell: powershell
        run: .\scripts\check-env.ps1 -Quiet

      - name: Version and language files
        shell: powershell
        run: |
          .\scripts\sync-version.ps1 -Check
          python tools\i18n.py --check
          python tools\i18n.py --lint

      - name: Core, CLI and menu DLL with the unit tests (Release)
        shell: powershell
        run: .\scripts\build.ps1 -Config Release -Test

      - name: The app (Release)
        shell: powershell
        run: |
          .\scripts\build-app.ps1 -Config Release
          .\scripts\build-app.ps1 -Config Release -SelfContained

      - name: Keep the test logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/**/Testing/Temporary/*.log
            build/*.txt
          retention-days: 7
          if-no-files-found: ignore
